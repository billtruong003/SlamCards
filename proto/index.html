<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dép Lào Tuổi Thơ · Đập dép lật bài online">
<meta name="twitter:description" content="Trò đập dép lật bài hồi nhỏ, giờ chơi ngay trên trình duyệt với 2–4 đứa bạn. Gửi link là vô, không cần tải app, miễn phí.">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
<link rel="stylesheet" href="./src/ftue.css">
<link rel="stylesheet" href="./src/social.css">
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div id="hud" hidden>
  <div id="players" class="players"></div>
  <div class="wind" id="wind"><span id="wind-arrow">➜</span><span id="wind-text"></span><span class="bars" id="wind-bars"></span></div>
</div>
<div id="banner" hidden></div>
<div id="out-card" class="out-card" hidden role="status">
  <p id="out-text"></p>
  <div class="row"><button class="btn" id="out-watch"></button><button class="btn pri" id="out-new" hidden></button></div>
</div>
<div id="hint" hidden></div>
<div id="toggle" hidden>
  <button id="type-flat" class="sel"></button>
  <button id="type-tilt"></button>
</div>

<div id="overlay"></div>
<div id="ad-lobby" class="ad-lobby" hidden></div>
<div id="toast" hidden></div>
<div id="maint" class="maint" role="status" hidden></div>
<div class="credit" id="credit"></div>
<div id="netstat"><span id="ping"></span><span id="fps"></span></div>
<div id="corner">
  <button id="leave" data-i18n-aria="corner.leaveAria" hidden><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 8l-4 4 4 4M5 12h11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="corner.leave"></span></button>
  <button id="lang" data-i18n-aria="corner.lang" hidden></button>
  <button id="help" data-i18n-aria="corner.help">?</button>
  <button id="donate" hidden></button>
  <button id="info" data-i18n="corner.info" data-i18n-aria="corner.infoAria"></button>
  <button id="settings" data-i18n="sound.title" data-i18n-aria="sound.aria"></button>
</div>
<div id="sound-panel" class="panel-box" hidden></div>
<div id="lang-panel" class="panel-box" hidden></div>
<div id="info-panel" class="panel-box" hidden>
  <h2 data-i18n="info.title"></h2>
  <p id="info-by"></p>
  <p><span data-i18n="info.portfolio"></span> <a href="https://www.billthedev.com" target="_blank" rel="noopener">www.billthedev.com</a></p>
  <p><span data-i18n="info.contact"></span> <a href="mailto:support@billthedevstudio.com">support@billthedevstudio.com</a></p>
  <p id="info-idea"></p>
  <p class="muted" id="info-credit"></p>
  <p class="muted" id="info-pets"></p>
  <p class="muted"><a href="./privacy.html" target="_blank" rel="noopener" data-i18n="info.privacy"></a></p>
  <div class="row"><button class="btn" id="open-report" data-i18n="report.button"></button><button class="btn" id="close-info" data-i18n="common.close"></button></div>
</div>

<div id="netfail" class="netfail" hidden>
  <div class="menu-card netfail-card" role="alertdialog" aria-labelledby="netfail-title">
    <h2 id="netfail-title" data-i18n="net.failTitle"></h2>
    <p id="netfail-body" data-i18n="net.failBody"></p>
    <button class="btn pri" id="netfail-retry" data-i18n="net.retry"></button>
    <p class="netfail-wait" id="netfail-wait"></p>
  </div>
</div>

<div id="gl-lost" class="netfail" hidden>
  <div class="menu-card netfail-card" role="alertdialog" aria-labelledby="gl-lost-title">
    <h2 id="gl-lost-title" data-i18n="gl.lostTitle"></h2>
    <p data-i18n="gl.lostBody"></p>
    <button class="btn pri" id="gl-lost-reload" data-i18n="common.reload"></button>
  </div>
</div>

<div id="boot-fail" class="netfail" hidden>
  <div class="menu-card netfail-card">
    <p data-i18n="boot.slow">Game tải lâu quá. Thử tải lại trang, hoặc mở bằng Chrome hay Safari bản mới nhé!</p>
  </div>
</div>
<script nomodule>document.getElementById('boot-fail').hidden = false;</script>
<script>
  // Browsers too old for the game's JavaScript load nothing and show no error; say so after a while.
  setTimeout(function () { if (!window.slamBooted) document.getElementById('boot-fail').hidden = false; }, 20000);
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
