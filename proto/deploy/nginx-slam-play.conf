# play.billthedevstudio.com/slam-cards -> Slam Cards (node on 127.0.0.1:8097): live as
# /etc/nginx/sites-enabled/slam-play. The game's main address since 22/10, when every .io.vn name
# stopped resolving (VNNIC's io.vn zone fails DNSSEC checks); billthedevstudio.io.vn and the old IP
# link (nginx-slam-domain.conf, nginx-slam-ip.conf) send their pages here. The certificate comes
# first, once: certbot certonly --nginx -d play.billthedevstudio.com
server {
    server_name play.billthedevstudio.com;

    gzip on;
    gzip_types application/wasm text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / { return 302 /slam-cards/; }
    # AdSense reads ads.txt at the domain root; the game server writes it from SLAM_ADSENSE_CLIENT
    location = /ads.txt {
        proxy_pass http://127.0.0.1:8097/ads.txt;
        proxy_set_header Host $host;
    }
    # search engines read robots.txt at the root only; it names the game's sitemap (/slam-cards/sitemap.xml)
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8097/robots.txt;
        proxy_set_header Host $host;
    }
    location = /slam-cards { return 301 /slam-cards/; }

    location = /slam-cards/ws {
        proxy_pass http://127.0.0.1:8097/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /slam-cards/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_set_header Host $host;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/play.billthedevstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.billthedevstudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain http: straight to https.
server {
    listen 80;
    listen [::]:80;
    server_name play.billthedevstudio.com;
    location / { return 301 https://play.billthedevstudio.com$request_uri; }
}
