# billthedevstudio.io.vn/slam-cards -> Slam Cards (node on 127.0.0.1:8097). The client uses
# relative paths, so the same build also keeps working at http://14.225.255.73:8096/.
server {
    server_name billthedevstudio.io.vn www.billthedevstudio.io.vn;

    gzip on;
    gzip_types application/wasm text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / { return 302 /slam-cards/; }
    # AdSense reads ads.txt at the domain root; the game server writes it from SLAM_ADSENSE_CLIENT
    # (404 while ads are off). Live nginx needs this block copied in (sites-enabled/slam-domain).
    location = /ads.txt {
        proxy_pass http://127.0.0.1:8097/ads.txt;
        proxy_set_header Host $host;
    }
    location = /slam-cards { return 301 /slam-cards/; }

    location = /slam-cards/ws {
        proxy_pass http://127.0.0.1:8097/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /slam-cards/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_set_header Host $host;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/billthedevstudio.io.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/billthedevstudio.io.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.billthedevstudio.io.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = billthedevstudio.io.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name billthedevstudio.io.vn www.billthedevstudio.io.vn;
    return 404; # managed by Certbot




}