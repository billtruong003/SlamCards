# billthedevstudio.io.vn: live as /etc/nginx/sites-enabled/slam-domain. The game's first domain; since
# 22/10 (.io.vn names stopped resolving, VNNIC's zone fails DNSSEC checks) its pages go to the main
# address https://play.billthedevstudio.com (nginx-slam-play.conf). One address only: the browser keeps
# the name, look and room tokens per address (V-03). The socket is still served, so a tab already
# open here keeps playing until its next reload.
server {
    server_name billthedevstudio.io.vn;

    gzip on;
    gzip_types application/wasm text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # AdSense reads ads.txt at the domain root; the game server writes it from SLAM_ADSENSE_CLIENT
    location = /ads.txt {
        proxy_pass http://127.0.0.1:8097/ads.txt;
        proxy_set_header Host $host;
    }
    location = /slam-cards/ws {
        proxy_pass http://127.0.0.1:8097/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / { return 301 https://play.billthedevstudio.com$request_uri; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/billthedevstudio.io.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/billthedevstudio.io.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# www: the same.
server {
    server_name www.billthedevstudio.io.vn;

    location = /slam-cards/ws {
        proxy_pass http://127.0.0.1:8097/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / { return 301 https://play.billthedevstudio.com$request_uri; }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/billthedevstudio.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billthedevstudio.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain http, either name: straight to the main https address in one hop.
server {
    listen 80;
    listen [::]:80;
    server_name billthedevstudio.io.vn www.billthedevstudio.io.vn;
    location / { return 301 https://play.billthedevstudio.com$request_uri; }
}