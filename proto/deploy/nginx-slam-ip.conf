# The first address the game had, http://14.225.255.73:8096/: live as /etc/nginx/sites-enabled/slam-cards.
# Pages (invite links included, ?room= kept) go to the main address,
# https://play.billthedevstudio.com/slam-cards/, so a player has one name and look, not one per
# address (V-03). The socket is still served, so a tab already open here keeps playing until its
# next reload.
server {
    listen 8096;
    listen [::]:8096;

    location /ws {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / { return 301 https://play.billthedevstudio.com/slam-cards$request_uri; }
}
