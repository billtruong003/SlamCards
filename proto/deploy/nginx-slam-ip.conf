# The first address the game had, http://14.225.255.73:8096/: live as /etc/nginx/sites-enabled/slam-cards.
# It serves the whole game again (22/10): every .io.vn name stopped resolving on DNS resolvers that
# check DNSSEC (VNNIC's io.vn zone), so sending players to billthedevstudio.io.vn left them on an
# error page. Once io.vn resolves again this can go back to a 301 to the domain (V-03: one address,
# one name and look per player).
server {
    listen 8096;
    listen [::]:8096;

    location /ws {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $host;
    }
}
